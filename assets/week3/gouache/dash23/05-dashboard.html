.kd-sheet { position: fixed; inset: 0; z-index: 5; box-shadow: none; overflow: hidden; overflow: clip; }      /* clip, not hidden: the camera's sheet is larger than the screen, and typing in the ask field scrolled a hidden box to 'show' the caret, which threw the whole dashboard up the screen */
canvas.wc { position: absolute; inset: 0; width: 100%; height: 100%; mix-blend-mode: multiply; pointer-events: none; }
/* Clean paint. The field's paint is one picture with a pixel of paint to a point of screen, so on a sharp (2x) screen
   each pixel of paint is 2 by 2, and 3 or 4 by 3 or 4 when the sheet steps in: its edges come out as little stairs.
   Noah, Nov 11: "is there any way to make the paint kind of lossless? ... not to make it like too vector-like and
   uninteresting ... clean and, you know, liquid-like? I don't want you to redo the engine". A blur over it (the first
   try) only made it soft; then: "some of the splotches on my screen when I'm looking at the dashboard look blurry ...
   please fix that and make sure it looks just as clean when zoomed in on." So the picture is drawn through a filter
   (#wc-clean, below the sheet) that redraws each splotch's edge at the screen's own sharpness: where there's paint is
   found, smoothed and cut again crisply, so a stair becomes a curve; the colour inside is the paint's own, smoothed by
   half a pixel of paint, never mixed with the white round it. The engine is untouched. Because the browser draws the
   filter at the size it is when it's set, it's set again (swapped for its twin, #wc-clean-b) whenever the sheet stops
   moving or changes size, so after a step in it's as clean as at rest. ?smooth=0 shows the raw picture, to compare */
.kd-sheet.smooth .kd-field > canvas.wc { filter: url(#wc-clean); }
.kd-sheet.smooth.alt .kd-field > canvas.wc { filter: url(#wc-clean-b); }
.kd-pencil { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
.kd-sheet button { font: inherit; }

/* top left: back to your page, then the library. No captions; a name while you point */
.kd-nav { position: fixed; left: 26px; top: 22px; z-index: 9; display: flex; flex-direction: column; gap: 8px; }
.kd-nav button { position: relative; width: 26px; height: 26px; border: 0; padding: 3px; background: none; color: var(--k-muted); cursor: pointer; transition: color .2s; }
.kd-nav button svg { display: block; width: 20px; height: 20px; overflow: visible; }
/* the way back: the rail's dashboard mark, arrows turned inward, at the size and in the corner it has in the rail */
.kd-nav button svg.mark-size { width: 14px; height: 14px; margin: 3px; }
.kd-nav button:hover, .kd-nav button.on { color: var(--k-text); }
.kd-nav button::after { content: attr(data-tip); position: absolute; left: 32px; top: 50%; transform: translateY(-50%); font-size: var(--t-1); color: var(--k-muted); white-space: nowrap; opacity: 0; transition: opacity .2s; pointer-events: none; }
.kd-nav button:hover::after, .kd-nav button:focus-visible::after { opacity: 1; }
.kd-nav button.on::after { opacity: 0; }

/* system text: pencil gray, small */
/* v20: everything along the top sits on one line, the middle of the back mark (35px down): the project, Group by and
   the view switch are centered on it, not set on a baseline (Noah, Nov 11, on v19: "Let's have all the pills and top
   line aligned together on the same line. Right now I think there's a little bit of off-centeredness.") */
.kd-top { position: absolute; left: 60px; right: 60px; top: 23px; height: 24px; display: flex; align-items: center; justify-content: flex-end; font-size: var(--t-2); line-height: var(--l-2); }
.kd-top b { font-weight: 500; color: var(--k-text); }
.kd-top .host { color: var(--k-faint); }
/* the project and where it's hosted, in the middle */
.kd-title { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; align-items: baseline; gap: 9px; white-space: nowrap; }
/* Group by: plain text. Point at it (or focus it) and the other ways show under it; the one you're on is marked */
.kd-by { position: relative; display: flex; align-items: baseline; color: var(--k-faint); transition: opacity .3s; }
.kd-by.off { opacity: 0; pointer-events: none; }
.by-now { display: inline-flex; align-items: baseline; gap: 6px; border: 0; padding: 0; background: none; color: var(--k-faint); cursor: default; }
/* v23: the word has room as wide as the longest of the three (they lie in one cell), so nothing along the top moves when
   it changes; and it fades out, then in (Noah: "it just kind of snaps to where the word needs to be ... a gentle
   animation where it fades in and fades out") */
#by-cur { display: inline-grid; justify-items: start; }
#by-cur > span { grid-area: 1 / 1; opacity: 0; transition: opacity .16s ease; }
#by-cur > span.on { opacity: 1; transition: opacity .16s ease .16s; }
.by-now:focus-visible, .by-list button:focus-visible, .kd-view button:focus-visible { outline: 1.5px solid rgba(43, 39, 35, .5); outline-offset: 3px; border-radius: 4px; }
.by-list { position: absolute; top: 100%; left: 0; z-index: 8; margin-top: 2px; display: flex; flex-direction: column; align-items: flex-start; padding: 6px 12px 8px; border-radius: 10px;
  background: color-mix(in srgb, var(--k-paper) 86%, transparent); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.kd-ov.by-list { box-shadow: none; }      /* no border, no box: only enough paper behind the words to read them over paint */
.by-list button { border: 0; padding: 3px 0; background: none; font-size: var(--t-2); line-height: var(--l-2); color: var(--c-soft); cursor: pointer; white-space: nowrap; transition: color .2s; }
.by-list button:hover { color: var(--c-text); }
.by-list button.on { color: var(--c-text); font-weight: 500; }
.by-list button[hidden] { display: none; }
/* the view: two small pencil icons, the paint and the lines. The one you're on is dark */
/* v20: Group by sits further from the switch (Noah: "Group by agent could be a little more to the left"); it was 22px */
.kd-view { position: relative; align-self: center; margin-left: 32px; display: flex; align-items: center; padding: 2px; border-radius: 999px; background: var(--c-ctl); cursor: pointer; }
/* one track, and a thumb behind the view you're on: it reads as a switch (Noah, Nov 11: "could the pair being a toggle be more clear?") */
.kd-view::before { content: ""; position: absolute; left: 2px; top: 2px; width: 26px; height: 22px; border-radius: 999px; background: var(--k-sheet); box-shadow: 0 0 0 1px rgba(40, 38, 35, .05), 0 1px 2px rgba(40, 38, 35, .08); transition: transform .3s cubic-bezier(.4, 0, .2, 1); }
.kd-view.tech::before { transform: translateX(26px); }
.kd-view button { position: relative; width: 26px; height: 22px; border: 0; padding: 3px 5px; background: none; color: var(--c-soft); cursor: pointer; transition: color .25s; }
.kd-view button svg { display: block; width: 16px; height: 16px; overflow: visible; }
.kd-view button.on { color: var(--c-text); }

/* ?embed=1: this page as the dashboard inside ../flow/views.html, which moves between closed, the rail and here. The
   outer page owns the mark top left and the ask field (they stay put across views), so they're not shown here. While
   the sheet is `bare` there's paper, the widget and nothing else: the outer page calls dash.arrive() to paint the field
   in and bring the top line in, and dash.leave() to lift it all again. On its own this page is unchanged */
.kd-sheet.embed #back { visibility: hidden; }
.kd-sheet.embed .kd-ask { display: none; }
.kd-sheet.embed .kd-top > *, .kd-sheet.embed #lib-btn, .kd-sheet.embed #set-btn { transition: opacity .26s ease, filter .26s ease, translate .3s cubic-bezier(.3, .7, .2, 1), color .2s; }
.kd-sheet.bare .kd-top > *, .kd-sheet.bare #lib-btn, .kd-sheet.bare #set-btn { opacity: 0; filter: blur(4px); translate: 0 -6px; pointer-events: none; }
.kd-sheet.bare #lib-btn, .kd-sheet.bare #set-btn { translate: -6px 0; }

/* the field: the open project's paint, in loops */
/* v21: the field lies on a sheet of its own that's larger than the screen, so it can step toward an agent like a
   camera. It has its own paper, so moving it doesn't cut the paint off from the paper it's painted on */
/* The paper doesn't zoom. Noah, Nov 11, on v23: "when we zoom in, it's a physical zoom in. Like, I can see more of the
   pixels on my screen. Instead of that, do you think we could actually just scale everything up to give the illusion of
   zooming in, but still keep that kind of like the pixels for the background?" So as the sheet steps in, its grain is
   drawn smaller by the same amount (--inv is 1 / the zoom), and stays the size it is everywhere else. Names and pencil
   already keep their size the same way. The paint itself is still one picture made larger */
.kd-cam { position: absolute; left: -60%; top: -60%; width: 220%; height: 220%; isolation: isolate; background-color: var(--k-paper); background-image: var(--k-grain); background-size: calc(220px * var(--inv, 1));
  transition: transform .62s cubic-bezier(.45, .05, .2, 1), background-size .62s cubic-bezier(.45, .05, .2, 1); }
.kd-field { position: absolute; left: 50%; top: calc(27.2727% + 70px); width: var(--fw, 1320px); height: var(--fh, 760px); margin-left: calc(var(--fw, 1320px) / -2); }      /* v22: --fw, --fh are set from the window (measure) */
/* fog: what lies over an agent that isn't the one you're on. Pale while you point at another; blurred and pale while
   another has the screen. It's laid over the paint, so the paint under it keeps working */
.kd-fog { position: absolute; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; opacity: 0; transition: opacity .3s ease;
  background-image: var(--k-grain); background-size: 220px;
  -webkit-mask-image: radial-gradient(closest-side, #000 calc(100% - 18px), transparent); mask-image: radial-gradient(closest-side, #000 calc(100% - 18px), transparent); }
.kd-fog.pale { background-color: color-mix(in srgb, var(--k-paper) 58%, transparent); transition: opacity .22s ease; }
.kd-fog.blur { background-color: color-mix(in srgb, var(--k-paper) 48%, transparent); -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px); }
.kd-fog.on { opacity: 1; }
.kd-fog.blur.on.peek { opacity: .7; }      /* point at the blurred others and they come up a little: a click there goes back */
/* v23: no zoom-out cursor while an agent has the screen (Noah: "I don't like how the zoom out though is a magnifying glass"). The blurred others still come up a little under the pointer */
/* notes are laid over the screen, not the sheet, so they stay the size they are when the sheet steps in */
.kd-notes { position: absolute; inset: 0; pointer-events: none; }
.thinking .kd-notes { display: none; }
/* the field never fades as a whole: a faded container cuts the paint off from the paper under it and shows it as a
   box. The paint's own canvas fades (script), names fade, pencil is drawn and lifted */
.kd-field.away > .kd-lab, .kd-field.away > .kd-tick { opacity: 0 !important; }
.kd-field.away > .kd-hit { pointer-events: none; }
/* pencil is drawn: a loop glides round its paint (--t is how long), and is lifted the way it was put down. A loop
   takes its agent's color gently */
.kd-pencil path.lp { stroke-dasharray: 1 2; stroke-dashoffset: 1.03; transition: stroke-dashoffset var(--t, .75s) cubic-bezier(.45, .05, .2, 1), stroke-dasharray 1.4s cubic-bezier(.4, 0, .2, 1), stroke .25s ease, stroke-opacity .25s ease, stroke-width .25s ease; }
.kd-pencil path.lp.on { stroke-dashoffset: 0; }
.kd-pencil path.lp.out { stroke-dashoffset: -1.03; }
.kd-pencil rect.hi { opacity: 0; transition: opacity .22s ease; }

/* everything laid over the sheet comes and goes the same way: up 8px out of a soft blur, and back */
.kd-ov { opacity: 0; visibility: hidden; pointer-events: none; filter: blur(4px); translate: 0 8px;
  box-shadow: 0 0 0 1px rgba(40, 38, 35, .11), 0 2px 5px rgba(40, 38, 35, .05), 0 14px 34px rgba(40, 38, 35, .11);
  transition: opacity .18s ease-in, filter .18s ease-in, translate .18s ease-in, visibility 0s .18s; }
.kd-ov.on { opacity: 1; visibility: visible; pointer-events: auto; filter: none; translate: 0 0;
  transition: opacity .26s cubic-bezier(.2, .7, .2, 1), filter .26s cubic-bezier(.2, .7, .2, 1), translate .26s cubic-bezier(.2, .7, .2, 1); }
.def { translate: 0 8px; filter: blur(4px); box-shadow: 0 0 0 1px rgba(40, 38, 35, .11), 0 2px 5px rgba(40, 38, 35, .05), 0 14px 34px rgba(40, 38, 35, .11); transition: opacity .18s ease-in, filter .18s ease-in, translate .18s ease-in; }
.def.on { translate: 0 0; filter: none; transition: opacity .26s cubic-bezier(.2, .7, .2, 1), filter .26s cubic-bezier(.2, .7, .2, 1), translate .26s cubic-bezier(.2, .7, .2, 1); }
.kd-cap { position: absolute; transform: translateX(-50%); font-size: var(--t-1); color: var(--k-faint); white-space: nowrap; pointer-events: none; font-variant-numeric: tabular-nums; transition: opacity .35s; }
.kd-cap.off { opacity: 0; }
.kd-lab.who small.t { font-variant-numeric: tabular-nums; }
.kd-lab { position: absolute; transform: translate(-50%, -50%); font-size: var(--t-2); color: var(--k-muted); white-space: nowrap; text-align: center; pointer-events: none; scale: var(--inv, 1); transition: opacity .35s, scale .62s cubic-bezier(.45, .05, .2, 1); }      /* --inv: words keep their size when the sheet steps in */
.kd-lab.off { opacity: 0; }
.kd-lab.who { font-size: var(--t-2); color: var(--c); }
.kd-lab.who.index { font-size: var(--t-1); line-height: var(--l-1); opacity: .72; }      /* in the index a name is the small size, and quieter */
/* waiting on you: its own color, for the group's name here and the words elsewhere */
.kd-lab.you, .th-label.you, .you-w { color: var(--c-you-deep); }
.kd-hit { position: absolute; border: 0; padding: 0; background: none; border-radius: 50%; cursor: pointer; transform: translate(-50%, -50%); z-index: 2; }
.kd-hit:focus-visible { outline: 1.5px solid rgba(43, 39, 35, .5); outline-offset: 2px; }
.kd-tick { position: absolute; transform: translateX(-50%); transform-origin: 50% 100%; font-size: var(--t-1); color: var(--c); white-space: nowrap; opacity: 0; scale: var(--inv, 1); transition: opacity .25s, scale .62s cubic-bezier(.45, .05, .2, 1); pointer-events: none; }
.kd-tick.on { opacity: 1; }


/* your page: a small floating widget. Drag it; click it to make it bigger */
.kd-widget { position: fixed; right: 36px; bottom: 32px; z-index: 7; width: 251px; height: 162px; border-radius: 10px; background: var(--k-sheet); overflow: hidden; cursor: pointer; touch-action: none;
  box-shadow: 0 0 0 1px var(--k-hair), 0 2px 4px rgba(40, 38, 35, .05), 0 14px 34px rgba(40, 38, 35, .12); transition: width .5s cubic-bezier(.4,0,.2,1), height .5s cubic-bezier(.4,0,.2,1), box-shadow .3s; }
.kd-widget.big { width: 561px; height: 361px; }
.kd-widget:hover { box-shadow: 0 0 0 1px rgba(40, 38, 35, .16), 0 2px 4px rgba(40, 38, 35, .05), 0 16px 38px rgba(40, 38, 35, .15); }
.kd-widget:focus-visible { outline: 1.5px solid rgba(43, 39, 35, .5); outline-offset: 3px; }
.kd-wpage { position: absolute; left: 0; top: 0; width: 660px; height: 425px; transform-origin: 0 0; transform: scale(.38); transition: transform .5s cubic-bezier(.4,0,.2,1); }
.kd-widget.big .kd-wpage { transform: scale(.85); }


.kd-set { display: flex; align-items: center; justify-content: space-between; padding: 5px 0; }
.kd-key { font-size: var(--t-1); color: var(--k-faint); }
.kd-sw { position: relative; width: 22px; height: 13px; border-radius: 999px; border: 0; padding: 0; cursor: pointer; background: var(--c-ctl); }
.kd-sw::after { content: ""; position: absolute; left: 2px; top: 2px; width: 9px; height: 9px; border-radius: 50%; background: var(--k-sheet); transition: transform .3s; }
.kd-sw.on { background: var(--c-ctl-on); }
.kd-sw.on::after { transform: translateX(9px); }
/* where you ask, here too: the rail's own field, bottom left (Noah, Nov 11: "It should be available both in the
   dashboard and in the rail view") */
/* v20: it stays on the left, a little wider, 360px (was 300). Noah, Nov 11, on v19: "Curious if it becomes too much
   like an LLM if the chat is centered. Maybe keeping the chat on the left is a good idea, but maybe we extend the chat
   box just a little bit." */
.kd-ask { position: absolute; left: 32px; bottom: 28px; width: 360px; margin: 0; }      /* v22: not fixed and no z-index, so it's no layer of its own: the pile's paint (../sys/pile.js) hangs off it, and paint in a layer of its own shows as a box */      /* left 32px: where the rail's own field sits, so it doesn't shift between the rail and here */
.kd-ask .front { outline: none; cursor: text; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 132px; overflow: hidden auto; scrollbar-width: none; }
.kd-ask .front:empty::before { content: attr(data-ph); color: var(--c-quiet); }
.kd-ask:focus-within .ask { box-shadow: 0 0 0 1px rgba(40, 38, 35, .3); }
/* technical view: the sheet turned over. Every agent's thinking, in its own words, from the rail's parts */
.kd-think { position: absolute; left: 60px; right: 60px; top: 84px; bottom: 100px; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 460px); grid-template-rows: minmax(0, 1fr); justify-content: center; gap: clamp(20px, 3.4vw, 56px); pointer-events: none; }
.thinking .kd-think { pointer-events: auto; }
/* its words come up down each column, a little after one another (--d), and each droplet is painted in at its row as
   its words arrive. The parts fade, never a container with a droplet in it */
#think .th-w { transition: opacity .24s ease var(--d, 0ms), translate .36s cubic-bezier(.2, .7, .2, 1) var(--d, 0ms), filter .24s ease var(--d, 0ms); }
#think .th-w:not(.in) { opacity: 0; translate: 0 6px; filter: blur(3px); }
#think.leaving .th-w { opacity: 0; filter: blur(3px); transition: opacity .16s ease-in, filter .16s ease-in; }
#think.leaving .th-job::before { opacity: 0; transition: opacity .16s ease-in; }
#think.leaving .th-d canvas, #think.leaving .th-d .ring { opacity: 0 !important; transition: opacity .16s ease-in; }
#think.solo .th-what .who-name { display: none; }      /* one agent: nothing to tell apart */
#think .th-d canvas, #think .th-d .ring { transition: opacity .25s ease; }
#think .th-d:not(.in) canvas, #think .th-d:not(.in) .ring { opacity: 0 !important; }
#think.by-agent .th-what .who-name { display: none; }
.th-job { position: relative; }
/* the columns fade into the paper at the bottom: a strip of the same paper laid over them, with the mask on the strip. A mask on the columns would cut the droplets off from the paper they're painted on */
.kd-think::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 56px; background-color: var(--k-paper); background-image: var(--k-grain); background-size: 220px; background-attachment: fixed; -webkit-mask-image: linear-gradient(transparent, #000); mask-image: linear-gradient(transparent, #000); pointer-events: none; opacity: 0; transition: opacity .2s ease; }
.thinking .kd-think::after { opacity: 1; transition: opacity .3s ease .25s; }      /* v21: the thinking is laid over the field's sheet now, so this strip is there only while the sheet is turned over */
.thinking .kd-field { pointer-events: none; }
.th-col { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
/* what you scroll up fades out under the agent's head, as it does at the foot (Noah, Nov 11: "when you scroll at the
   top, it should kind of disappear or fade out just as it does on the bottom. Not as lightly as the bottom because
   there's a bigger gap between it, but it should be fading out"). A strip of paper over the top of the column's list,
   shorter and firmer than the foot's, there only once you've scrolled (--tf, set as you scroll) */
.th-col::after { content: ""; position: absolute; left: -6px; right: -6px; top: var(--bt, 0px); height: 38px; z-index: 1; pointer-events: none; opacity: var(--tf, 0); background-color: var(--k-paper); background-image: var(--k-grain); background-size: 220px; background-attachment: fixed; -webkit-mask-image: linear-gradient(#000 30%, transparent); mask-image: linear-gradient(#000 30%, transparent); }
.th-label { display: flex; align-items: baseline; justify-content: space-between; min-height: 32px; padding: 6px 0 0 48px; font-size: var(--t-2); line-height: var(--l-2); font-weight: 500; color: var(--c-text); }
.th-label .who-meta { font-weight: 400; }
.th-body { flex: 1; min-height: 0; margin-top: var(--s-5); padding-bottom: 60px; overflow: hidden auto; scrollbar-width: none; display: flex; flex-direction: column; gap: var(--s-6); }
.th-body::-webkit-scrollbar { display: none; }
.th-job { padding-top: var(--s-4); border-top: 1px solid transparent; }
/* v23: the rule over a job is a pencil line (Noah: "still straight lines at the same opacity, but maybe not perfectly
   straight ... very, very almost unnoticeably funny in the way we draw the circles"). Then, on seeing it: "they should
   be our graphite lines, and they should be a little noticeably like imperfect, which would be cool. The topmost ones
   that divide the Agent from their task forces are fine." So the first rule in a column is as it was (a wobble of half
   a pixel), and the others wander about a pixel and a half and stop a little short of the edges, like a line drawn
   along no ruler. The hairline's own gray and weight. Four hands, turned round in every other column */
.th-job::before { content: ""; position: absolute; left: 0; right: 0; top: -4px; height: 6px; pointer-events: none; opacity: 0; transition: opacity .4s ease var(--d, 0ms);
  background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 6' preserveAspectRatio='none'><path d='M0.6 3.4C13 1.7 27 4.5 43 2.9 60 1.5 78 4.6 99.4 2.7' fill='none' stroke='rgb(40,38,35)' stroke-opacity='.1' stroke-width='1' stroke-linecap='round' vector-effect='non-scaling-stroke'/></svg>") 0 0 / 100% 100% no-repeat; }
.th-job:nth-child(4n+2)::before { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 6' preserveAspectRatio='none'><path d='M0.4 2.6C17 4.4 33 1.8 52 3.3 69 4.5 86 1.9 99.6 3.5' fill='none' stroke='rgb(40,38,35)' stroke-opacity='.1' stroke-width='1' stroke-linecap='round' vector-effect='non-scaling-stroke'/></svg>"); }
.th-job:nth-child(4n+3)::before { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 6' preserveAspectRatio='none'><path d='M0.8 3.8C11 2.2 29 1.6 46 3.4 63 4.8 81 2.1 99.2 3.1' fill='none' stroke='rgb(40,38,35)' stroke-opacity='.1' stroke-width='1' stroke-linecap='round' vector-effect='non-scaling-stroke'/></svg>"); }
.th-job:nth-child(4n)::before { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 6' preserveAspectRatio='none'><path d='M0.5 2.9C20 4.6 36 2.3 54 1.9 71 1.6 87 4.2 99.5 3.3' fill='none' stroke='rgb(40,38,35)' stroke-opacity='.1' stroke-width='1' stroke-linecap='round' vector-effect='non-scaling-stroke'/></svg>"); }
.th-job:first-child::before { top: -2px; height: 3px; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 3' preserveAspectRatio='none'><path d='M0 1.5C16 1.1 30 2 47 1.55 65 1.1 82 1.9 100 1.4' fill='none' stroke='rgb(40,38,35)' stroke-opacity='.1' stroke-width='1' stroke-linecap='round' vector-effect='non-scaling-stroke'/></svg>"); }
.th-col:nth-child(even) .th-job::before { transform: scaleX(-1); }
.th-job.in::before { opacity: 1; }
.th-top { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s-3); padding-left: 48px; font-size: var(--t-1); line-height: var(--l-1); color: var(--c-quiet); }
.th-what { padding-left: 48px; margin-top: var(--s-2); }
.th-what .who-name { display: block; }
.th-what .who-say { margin-top: 2px; }
.th-job .who-lines { margin-top: var(--s-4); gap: var(--s-4); }
.th-thought + .th-thought { margin-top: 6px; }
.th-thought.off { display: none; }
.th-thought { animation: th-in .5s ease both; }
.th-fact { display: block; margin-top: 6px; font-size: var(--t-1); line-height: var(--l-1); color: var(--c-quiet); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
@keyframes th-in { from { opacity: 0; transform: translateY(2px); } }
@media (prefers-reduced-motion: reduce) { .kd-widget, .kd-wpage, .kd-ov, .def, #think .th-w, .th-job::before, #by-cur > span, .kd-pencil path.lp, .kd-cam, .kd-fog, .kd-lab, .kd-tick { transition-duration: .01s !important; transition-delay: 0s !important; } }

/* ---- v22 ---- */
/* the veil over the field while a bundle's note is open: everything blurs and pales but a soft hole where that bundle
   is (--hx, --hy, --hr, set when the note opens). It lies over the field's sheet and under the top line */
#veil { -webkit-mask-image: radial-gradient(circle at var(--hx, -999px) var(--hy, -999px), transparent calc(var(--hr, 0px) - 10px), #000 calc(var(--hr, 0px) + 12px)); mask-image: radial-gradient(circle at var(--hx, -999px) var(--hy, -999px), transparent calc(var(--hr, 0px) - 10px), #000 calc(var(--hr, 0px) + 12px)); }
.thinking #veil { display: none; }
/* the library, settings and a word's meaning: notes laid over everything but the marks top left, the ask field and your page */
.kd-pops { position: absolute; inset: 0; pointer-events: none; }
.kd-prows { position: relative; padding: 12px 18px 12px 12px; display: flex; flex-direction: column; gap: 6px; }
.kd-prow { display: flex; align-items: center; gap: 10px; border: 0; padding: 0; background: none; font-size: var(--t-2); line-height: var(--l-2); color: var(--c-soft); text-align: left; cursor: pointer; }

    if (foc && !solo()) GS.forEach((g) => { if (g.blur && g.key !== foc) g.blur.classList.toggle('peek', Math.hypot(x - g.cx, y - g.cy) < g.r + 12); });
    // v22: pointing anywhere inside a group's loop marks that group's parts on your page in the corner
    const g = foc || POPS.some(([, n]) => n.isOpen) || e.target.closest('#widget, #ask, .note, .kd-nav, .kd-top') ? null : GS.find((g) => Math.hypot(x - g.cx, y - g.cy) < g.r), key = g ? g.key : null;
    if (key !== hovG) { hovG = key; refresh(); }
  });
  sheet.addEventListener('mouseleave', () => { if (hovG !== null) { hovG = null; refresh(); } });

  // ---- the library and settings: notes in pencil, shut until asked for (v22: they were white cards). While one is
  // open everything under it blurs and pales, the same as for a bundle's note
  const popsEl = $('pops'), veilB = note.veil(popsEl);
  const libNote = note.make(popsEl, { at: [62, 46], w: 172, c: 'var(--c-text)', halo: false }), libRows = document.createElement('div');
  libNote.el.id = 'lib'; libNote.el.setAttribute('aria-label', 'Projects'); libNote.el.querySelector('.note-body').hidden = true; libRows.className = 'kd-prows'; libNote.el.appendChild(libRows);
  const setNote = note.make(popsEl, { at: [62, 100], w: 236, c: 'var(--c-text)', halo: false }), setRows = document.createElement('div');
  setNote.el.id = 'set-pop'; setNote.el.querySelector('.note-body').hidden = true; setRows.className = 'kd-sets';
  // v23: meta-prompting is a setting, not a toggle in the field (Noah: "I think we could remove the meta prompting toggle.
  // from the chat box itself and just put it into settings"). In Settings it has one row, in plain words: "Rephrase my
  // ask". That row was here already and is the same thing (Enter rewrites your ask in place; a second Enter sends it),
  // so a second row named "Meta-prompting" was one switch too many. Noah, Nov 11, asked which name the row keeps:
  // "Rephrase my ask". On by default; it keeps its state for the page's life and changes nothing else in this sketch
  setRows.innerHTML = '<div class="kd-set"><span>Rephrase my ask</span><button class="kd-sw on" id="set-mp" aria-label="Rephrase my ask" aria-pressed="true"></button></div><div class="kd-set"><span>Explain design words</span><button class="kd-sw on" aria-label="Explain design words"></button></div><div class="kd-set"><span>Open Gouache</span><span class="kd-key">⌥ Space</span></div>';
  setNote.el.appendChild(setRows);
  const POPS = [[libBtn, libNote], [$('set-btn'), setNote]];
  // v23: while the library is open your page in the corner is big, so you can tell which project you're looking at
  // (Noah: "When we open the library, maybe the dashboard on the bottom automatically becomes bigger"). It goes back
  // when the library shuts, unless it was big already or you changed its size yourself meanwhile (libBig)
  let libBig = false;
  const pageBig = (on) => { const w = $('widget'); if (on) { libBig = !w.classList.contains('big'); if (libBig) w.classList.add('big'); } else if (libBig) { libBig = false; w.classList.remove('big'); } };
  function shut(except) { POPS.forEach(([b, n]) => { if (n !== except && n.isOpen) { n.open(false); b.classList.remove('on'); b.setAttribute('aria-expanded', 'false'); if (n === libNote) pageBig(false); } }); if (!except) veilB.on(false); peek(null); }
  POPS.forEach(([b, n]) => { b.onclick = (e) => { e.stopPropagation(); shut(n); const on = !n.isOpen; n.open(on); veilB.on(on); b.classList.toggle('on', on); b.setAttribute('aria-expanded', on); if (n === libNote) pageBig(on); }; n.el.addEventListener('click', (e) => e.stopPropagation()); });
  document.addEventListener('click', () => shut());
  // Esc, one thing at a time: a word's meaning, then the library or settings, then the note and the focus together
  // (v23: they were two presses), then the pile if it's up
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (wordNote) return wordOff();
    if (nt && notes.querySelector('.note.small.open')) return void nt.mean();
    if (POPS.some(([, n]) => n.isOpen)) return shut();
    if (foc || selQ || sel !== null || only) return stepBack();
    if (asked.isUp()) return void asked.toggle();
  });
  document.querySelectorAll('.kd-sw').forEach((s) => { s.onclick = () => { const on = s.classList.toggle('on'); s.setAttribute('aria-pressed', on); if (s.id === 'set-mp') $('ask').classList.toggle('on', on); }; });
  // the view is a switch: a click anywhere on it turns it over, and the arrow keys pick a side
  $('view').onclick = (e) => { e.stopPropagation(); setTech(!tech); };
  $('view').onkeydown = (e) => { if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); setTech(e.key === 'ArrowRight'); $(tech ? 'tech-btn' : 'paint-btn').focus(); } };

  // ---- the way back: the rail's dashboard mark with its arrows turned inward, in the corner it has in the rail. From
  // the rail, the arrows turn in as the dashboard opens; going back they turn out first, and the rail has them outward
  const back = $('back'), fromRail = /\/v\d+\/0[1-4]-/.test(document.referrer);
  back.innerHTML = rail.MARK.home;
  const mark = back.firstElementChild;
  if (fromRail && !wc.still()) requestAnimationFrame(() => requestAnimationFrame(() => mark.classList.add('in'))); else mark.classList.add('in');
  back.onclick = (e) => {
    e.stopPropagation(); mark.classList.remove('in');
    setTimeout(() => { if (fromRail && history.length > 1) history.back(); else location.href = '../v15/03-watch.html?agents=' + Math.min(3, AGENTS.length); }, wc.still() ? 0 : 340);
  };
  addEventListener('pageshow', (e) => { if (e.persisted) mark.classList.add('in'); });

  // ---- where you ask: the rail's field, now real and naming its agent with @ (rail.target in ../sys/rail.js). Noah,
  // Nov 11, in chat, on the prototype (../sys/ask-target.html): "The asking feature works really well. I think we can
  // just push this onto our main build." With one agent its name is baked in; with more, clicking in puts an @ there
  // and the agent you choose stays until you change it. Enter sends it off (what happens next is the Chat box workshop)
  $('sheet').addEventListener('scroll', (e) => { e.currentTarget.scrollTop = 0; e.currentTarget.scrollLeft = 0; });      // belt and braces for a browser without overflow: clip
  const askWrap = $('ask');
  askWrap.onclick = (e) => e.stopPropagation();
  // what you send becomes a pile you pull up, over the field (../sys/pile.js), the same as in the rail
  const asked = pile.mount(askWrap, { ...(AGENTS.length === 1 ? { pig: (rail.HUES[AGENTS[0].id] || [])[1], c: `var(--c-${AGENTS[0].id})` } : {}), on: onAsk });      // v22: and each step of each ask is painted into its agent's loop (onAsk)
  rail.target(askWrap, AGENTS.map((a) => a.id), { send: (t, who) => asked.add(t, who) });

  // ---- the widget: drag it anywhere; a click makes it bigger, another puts it back
  const wg = $('widget');
  let drag = null; const off = { x: 0, y: 0 };
  wg.onpointerdown = (e) => { drag = { sx: e.clientX, sy: e.clientY, ox: off.x, oy: off.y, moved: false }; wg.setPointerCapture(e.pointerId); };
  wg.onpointermove = (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    if (!drag.moved && Math.hypot(dx, dy) < 5) return;
    drag.moved = true; off.x = drag.ox + dx; off.y = drag.oy + dy; wg.style.translate = `${off.x}px ${off.y}px`;
  };
  wg.onpointerup = wg.onpointercancel = () => { if (drag && !drag.moved) { wg.classList.toggle('big'); libBig = false; } drag = null; };      // your own click: the library leaves its size alone after that
  wg.onclick = (e) => e.stopPropagation();
  wg.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); wg.classList.toggle('big'); libBig = false; } };

  // a design word's meaning, outside a note (the technical view's words): the small pencil note, the explanation alone
  // (v22: it was a white card with the word as a title). Inside a note, the note shows its own (../sys/note.js)
  let wordNote = null, wordT = 0;
  const wordOff = () => { clearTimeout(wordT); if (wordNote) { wordNote.remove(); wordNote = null; } };
  sheet.addEventListener('mouseover', (e) => {
    const t = e.target.closest('.term'); if (!t || t.closest('.note')) return;
    clearTimeout(wordT); if (wordNote && wordNote.term === t) return; wordOff();
    const b = sheet.getBoundingClientRect(), r = t.getBoundingClientRect(), x = r.left - b.left, y = r.bottom - b.top;
    wordNote = note.make(popsEl, { small: true, at: [Math.max(12, Math.min(x - 6, b.width - 230)), y + 12], from: [x + 12, y + 2] });
    wordNote.say(t.dataset.def, true); wordNote.term = t;
    if (y + 12 + wordNote.el.offsetHeight > b.height - 12) wordNote.el.style.top = r.top - b.top - wordNote.el.offsetHeight - 10 + 'px';      // no room under the word: over it
    wordNote.open();
  });
  sheet.addEventListener('mouseout', (e) => { if (e.target.closest('.term') && !e.target.closest('.note')) wordT = setTimeout(wordOff, 220); });
  // any window size: laid out again once the window has stopped changing. The paint comes up on the new sheet, a
  // focus is kept, and anything open is put away
  let rz = 0;
  addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => {
    const w0 = W, h0 = H; measure(); if (W === w0 && H === h0) return;
    const keep = foc; shut(); stopMoves(); stopTech(); open(P.id, keep);
  }, 220); });
  measure();
  buildLib();
  if (EMBED) {
    sheet.classList.add('embed', 'bare'); field.classList.add('away');
    const showView = () => { $('view').classList.toggle('tech', tech); $('tech-btn').classList.toggle('on', tech); $('tech-btn').setAttribute('aria-pressed', tech); $('paint-btn').classList.toggle('on', !tech); $('paint-btn').setAttribute('aria-pressed', !tech); };
    window.dash = {
      // the field's paint is painted in, a droplet at a time, with its loops drawn; the top line comes in
      arrive() {
        if (!bare) return;
        bare = false; sheet.classList.remove('bare'); field.classList.remove('away'); stopTech(); stopMoves(); paint(true);
        layout(wc.still() ? true : 'back'); refresh();
      },
      // everything lifts where it is: loops, paint, the top line, anything open
      leave() {
        if (bare) return;
        shut(); byOpen(false); unfocus('skip'); sel = null; only = null; refresh(); stopTech(); stopMoves();
        if (tech) { tech = false; showView(); clearThink(); sheet.classList.remove('thinking'); }
        bare = true; sheet.classList.add('bare'); undraw(wc.still()); field.classList.add('away');
        stains().sort((a, b) => a.x + a.y * 0.3 - (b.x + b.y * 0.3)).forEach((s, i) => techTimers.push(setTimeout(() => leaveFast(s), wc.still() ? 0 : Math.min(i * 16, 220))));
      },
      widget: () => $('widget').getBoundingClientRect(),
    };
    // keys pressed in here belong to the outer page too: Esc with nothing open goes back, Option Space closes
    document.addEventListener('keydown', (e) => {
      const v = parent.views; if (!v) return;
      if (e.key === 'Escape') { if (sel === null && !selQ && !only && !foc && !POPS.some(([, n]) => n.isOpen) && !asked.isUp() && document.activeElement === document.body) v.key('Escape'); }
      else if (e.altKey && e.code === 'Space') { e.preventDefault(); v.key('AltSpace'); }
    }, true);
  }
  open('juniper');
  // v23, ?asks=N (1 to 8): N asks are sent for you once the sheet has settled, a little over a second apart, to the
  // agents in turn, so the pile can be watched filling over the ask field (Noah: "I would like to see an edge case where
  // the chat box is being used and the notifications are piling in above the chat box"). These are sample asks about
  // Juniper's page, not anything anyone asked; what comes back is the pile's own canned lines
  const ASKS = ['make the button bigger', 'warm up the headline', 'round the form’s corners', 'line the three cards up', 'make the email field taller', 'check the colors are easy to read', 'tighten the space under the headline', 'make the links in the header darker'];
  const askN0 = EMBED ? 0 : Math.max(0, Math.min(8, +(Q.get('asks') || 0)));
  for (let i = 0; i < askN0; i++) setTimeout(() => asked.add(ASKS[i], AGENTS[i % AGENTS.length].id), 2200 + i * 1150);
</script>
